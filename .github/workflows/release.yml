name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Cross-compiles for every platform gh supports and attaches the
      # binaries to the tag's release, which is what `gh extension install`
      # and `gh extension upgrade` download.
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
